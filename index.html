<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>The Magnetic Library</title>
<meta name="description" content="A cassette-deck audiobook studio that narrates PDF books by archival reconstruction from recorded voices.">
<meta name="theme-color" content="#2c2d30">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 40'%3E%3Crect x='1' y='1' width='62' height='38' rx='4' fill='%232b2724'/%3E%3Crect x='6' y='5' width='52' height='18' rx='2' fill='%23f1e7cf'/%3E%3Crect x='6' y='5' width='52' height='4' fill='%236e1e22'/%3E%3Ccircle cx='21' cy='29' r='5' fill='%23ffb347'/%3E%3Ccircle cx='43' cy='29' r='5' fill='%23ffb347'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --wood1: #5b3a24; --wood2: #3a2416; --wood3: #7b5236;
  --metal1: #4a4c50; --metal2: #2c2d30; --metal3: #6b6e73;
  --accent: #6e1e22; --led: #ffb347;
  --key1: #e9e0c9; --key2: #c9bc9b; --key-ink: #3a2a1c;
  --paper: #f1e7cf; --paper2: #e6d9bb; --ink: #2a1d14; --ink-soft: #5a4634;
  --room: #140e0a; --text: #ecdfc6; --muted: #a8987c; --danger: #a8322c; --ok: #6faa6f;
  --serif: 'EB Garamond', Garamond, 'Adobe Garamond Pro', 'Times New Roman', serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
  --r: 6px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(1200px 700px at 50% -10%, #2b1d13 0%, var(--room) 60%) fixed, var(--room);
  color: var(--text); font-family: var(--serif); font-size: 18px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--led); }
code { font-family: var(--mono); font-size: .82em; background: rgba(0,0,0,.25); padding: 0 .3em; border-radius: 3px; }
h1, h2, h3, h4 { font-weight: 500; line-height: 1.15; margin: .2em 0 .5em; }
.display { font-style: italic; letter-spacing: .01em; }
h4 { font-size: 1rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 600; color: var(--ink-soft); }
.muted { color: var(--muted); } .paper .muted, .desk-panel .muted, #vtabBody .muted { color: #7a6650; }
.fine { font-size: .82rem; color: var(--muted); } .paper .fine, .desk-panel .fine { color: #7a6650; }
.err { color: #ff8a7a; min-height: 1.2em; } .paper .err { color: var(--danger); }
.warn-note { background: rgba(255,179,71,.1); border-left: 3px solid var(--led); padding: .4em .8em; border-radius: 3px; }
.engr { font-family: var(--serif); font-variant: small-caps; text-transform: lowercase; letter-spacing: .16em; font-size: .82rem; color: #d9cfbc; text-shadow: 0 1px 0 rgba(0,0,0,.6); }
.engr.dim { opacity: .55; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
.row.end { justify-content: flex-end; } .row.between { justify-content: space-between; } .row.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: .5rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; }
.nowrap { white-space: nowrap; }
.scroll-x { overflow-x: auto; }
ul.plain { list-style: none; padding: 0; margin: 0; } ul.plain li { padding: .25em 0; border-bottom: 1px dotted rgba(127,100,70,.3); }


.led { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3a2a1a; box-shadow: inset 0 1px 2px rgba(0,0,0,.8); vertical-align: middle; flex: none; }
.led.on { background: var(--led); box-shadow: 0 0 8px var(--led), 0 0 2px #fff inset; }
.led.on.red { background: #ff4b3a; box-shadow: 0 0 10px #ff4b3a; animation: blink 1.2s infinite; }
.led.on.green { background: #8dff9e; box-shadow: 0 0 6px #8dff9e; }
@keyframes blink { 50% { opacity: .35; } }


.btn { appearance: none; border: 1px solid #1d130c; background: linear-gradient(#7a2a2c, var(--accent)); color: #f6ecd8; padding: .45em 1.1em; border-radius: var(--r); cursor: pointer; font-size: .95rem; letter-spacing: .03em; box-shadow: 0 2px 0 #1d0c0b, inset 0 1px 0 rgba(255,255,255,.18); text-decoration: none; display: inline-block; transition: transform .06s; }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 #1d0c0b; }
.btn.ghost { background: transparent; color: inherit; border-color: rgba(168,152,124,.5); box-shadow: none; }
.btn.danger { background: linear-gradient(#a8322c, #7a1d18); } .btn.ghost.danger { background: transparent; color: #d9584e; border-color: rgba(217,88,78,.5); }
.btn.sm { font-size: .85rem; padding: .3em .8em; } .btn.big { font-size: 1.15rem; padding: .6em 1.6em; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.link { background: none; border: 0; color: inherit; text-decoration: underline dotted; cursor: pointer; padding: 0; text-align: left; }
.mini-btn { background: rgba(0,0,0,.18); border: 1px solid rgba(168,152,124,.35); border-radius: 4px; padding: .05em .45em; font-size: .78rem; cursor: pointer; margin: 0 .1em; }
.mini-btn:hover { border-color: var(--led); } .mini-btn.danger { color: #e0675c; } .mini-btn:disabled { opacity: .4; cursor: default; }
.paper .mini-btn { background: rgba(255,255,255,.35); }
.badge { font-family: var(--mono); font-size: .65rem; background: var(--accent); color: #f6ecd8; padding: .1em .45em; border-radius: 3px; letter-spacing: .1em; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { font-size: .85rem; padding: .1em .6em; border-radius: 99px; border: 1px solid rgba(168,152,124,.45); background: rgba(0,0,0,.15); cursor: default; }
button.chip { cursor: pointer; } .chip small { opacity: .6; }


.paper { background: linear-gradient(170deg, var(--paper), var(--paper2)); color: var(--ink); border-radius: 4px; box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 0 60px rgba(120,90,50,.12); }
.paper h1, .paper h2, .paper h3 { color: var(--ink); }
.card { padding: 2rem 2.2rem; max-width: 520px; width: 100%; }
.card.wide { max-width: 720px; }
label { display: block; margin: .6rem 0; }
label > span:first-child:not(.engr) { display: block; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: .2em; }
input:not([type=checkbox]):not([type=range]):not([type=color]), select, textarea { width: 100%; padding: .45em .6em; border: 1px solid #b8a682; background: #fbf5e7; color: var(--ink); border-radius: 4px; }
input[type=color] { width: 54px; height: 32px; border: 1px solid #555; padding: 0; background: none; border-radius: 4px; cursor: pointer; }
textarea { resize: vertical; line-height: 1.45; }
label.check { display: inline-flex; gap: .45em; align-items: center; cursor: pointer; }
.sel { width: 100%; padding: .35em .5em; background: #1a120c; color: var(--text); border: 1px solid #5a4430; border-radius: 4px; }
.paper .sel { background: #fbf5e7; color: var(--ink); border-color: #b8a682; }
.form.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 .8rem; }
.range input { width: 100%; accent-color: var(--accent); }


.center-screen { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
.warm { font-family: var(--mono); color: var(--led); letter-spacing: .2em; text-transform: uppercase; font-size: .85rem; }
.auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; gap: 3rem; align-items: center; padding: 3rem 6vw; }
.auth-machine { display: grid; place-items: center; }
.auth-tape { width: min(520px, 90%); filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); transform: rotate(-4deg); }
.lede { font-size: 1.1rem; font-style: italic; color: var(--ink-soft); }
.auth .card h1 { font-size: 2.3rem; }


.topbar { display: flex; align-items: center; gap: 1.5rem; padding: .7rem 1.4rem; background: linear-gradient(var(--metal1), var(--metal2)); border-bottom: 1px solid #000; box-shadow: 0 2px 12px rgba(0,0,0,.5); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
.topbar::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); pointer-events: none; }
.brand { display: flex; gap: .8rem; align-items: center; }
.brand-reels { display: flex; gap: 6px; } .brand-reels i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--key1); box-shadow: inset 0 0 0 4px var(--metal2), inset 0 0 0 6px var(--key2); }
.brand-name { font-style: italic; font-size: 1.3rem; color: #f3e8d2; line-height: 1; }
.brand-sub { font-variant: small-caps; text-transform: lowercase; letter-spacing: .18em; font-size: .72rem; color: #bfb39c; }
.tabs { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1; }
.tab { white-space: nowrap; background: transparent; border: 1px solid transparent; color: #d4c8b0; padding: .3em .9em; border-radius: 3px; cursor: pointer; font-variant: small-caps; text-transform: lowercase; letter-spacing: .12em; font-size: .92rem; }
.tab:hover { border-color: rgba(255,255,255,.12); }
.tab.on { background: rgba(0,0,0,.35); color: var(--led); border-color: rgba(0,0,0,.6); box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
.who { display: flex; gap: .5rem; align-items: center; font-size: .9rem; }
main { padding: 1.4rem; max-width: 1500px; margin: 0 auto; }
.foot { text-align: center; color: var(--muted); font-size: .8rem; padding: 1rem 1rem 2rem; font-style: italic; }


.deck {
  border-radius: 14px; padding: 18px; position: relative;
  background:
    repeating-linear-gradient(92deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px, rgba(255,255,255,.03) 9px 10px, transparent 10px 23px),
    linear-gradient(175deg, var(--wood3), var(--wood1) 40%, var(--wood2));
  box-shadow: 0 30px 60px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.4);
}
.deck-plate { display: flex; justify-content: space-between; align-items: center; padding: .35rem 1rem; margin-bottom: 14px; border-radius: 6px; background: linear-gradient(var(--metal3), var(--metal1) 45%, var(--metal2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 2px 4px rgba(0,0,0,.5); }
.power { display: flex; gap: .45rem; align-items: center; }
.bays { display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: 14px; }
.bay {
  border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), linear-gradient(var(--metal1), var(--metal2));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -2px 0 rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.45);
}
.bay-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,.35); padding-bottom: 4px; gap: .5rem; }
.rec-led { display: flex; gap: .35rem; align-items: center; }
.window {
  position: relative; border-radius: 6px; min-height: 140px; display: grid; place-items: center; padding: 10px;
  background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,0) 40%), #0d0907;
  box-shadow: inset 0 4px 12px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.12);
}
.window::after { content: ''; position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(115deg, rgba(255,255,255,.1) 0 18%, transparent 30%); pointer-events: none; }
.window .cassette { width: 100%; max-width: 300px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.6)); }
.master-win .cassette { max-width: 420px; }
.drop.over { outline: 2px dashed var(--led); outline-offset: -6px; }
.slot-empty { text-align: center; color: #8a7a62; display: flex; flex-direction: column; gap: .2em; font-style: italic; }
.slot-empty b { color: #c9b896; font-weight: 500; font-style: normal; letter-spacing: .06em; }
.cassette.spin .reel { animation: spin 2.2s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.tape-in { animation: tapeIn .9s cubic-bezier(.2,.9,.3,1.2) both .5s; }
@keyframes tapeIn { from { transform: scale(.6) translateY(-20px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-anim { position: absolute; width: 70px; height: 92px; background: #fbf5e7; border-radius: 2px; box-shadow: 0 6px 14px rgba(0,0,0,.6); z-index: 2; animation: sheet 1.1s ease-in both; background-image: repeating-linear-gradient(#fbf5e7 0 7px, #c9bc9b 7px 8px); }
@keyframes sheet { 0% { transform: translateY(-160px) rotate(-8deg); opacity: 1; } 60% { transform: translateY(0) rotate(0) scale(.9); opacity: 1; } 100% { transform: translateY(10px) scale(.5); opacity: 0; } }
.eject-anim { animation: ejectOut .45s ease-in forwards; }
@keyframes ejectOut { to { transform: translateY(-120%) rotate(4deg); opacity: 0; } }


.lcd { background: radial-gradient(ellipse at 50% 0%, #2a1a08, #120a03 70%); border-radius: 4px; padding: .5em .8em; font-family: var(--mono); color: var(--led); text-shadow: 0 0 6px var(--led); font-size: .82rem; letter-spacing: .06em; box-shadow: inset 0 2px 8px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.1); min-height: 3.2em; text-transform: uppercase; }
.lcd .dim { opacity: .55; } .lcd.small { font-size: .74rem; }
.lcd .kv { display: flex; justify-content: space-between; gap: .5em; } .lcd .kv span { opacity: .65; }
.lcd-l1 { font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcd-l2 { opacity: .75; font-size: .76rem; }
.lcd .bar { height: 4px; background: rgba(255,179,71,.15); margin-top: .4em; } .lcd .bar i { display: block; height: 100%; background: var(--led); box-shadow: 0 0 6px var(--led); }


.counters { display: flex; gap: 1rem; justify-content: space-around; flex-wrap: wrap; }
.counter-wrap { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
.counter { display: flex; align-items: center; background: #0c0805; padding: 3px 6px; border-radius: 4px; box-shadow: inset 0 2px 6px rgba(0,0,0,.95); font-family: var(--mono); font-size: 1.05rem; }
.wheel { display: inline-block; height: 1em; width: .78em; overflow: hidden; line-height: 1em; margin: 0 1px; background: linear-gradient(#ddd2bb, #f8f1e2 45%, #c9bc9b); color: #1d140c; border-radius: 2px; text-align: center; box-shadow: inset 0 3px 3px rgba(0,0,0,.45), inset 0 -3px 3px rgba(0,0,0,.45); }
.strip { display: block; transition: transform .35s cubic-bezier(.3,1.4,.6,1); }
.strip i { display: block; height: 1em; font-style: normal; }
.counter .sep { color: #c9bc9b; padding: 0 1px; }
.tape-track { height: 5px; background: #0c0805; border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 2px #000; }
.tape-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4a3221, #8a5a34); }


.keys { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
.keys.col { flex-direction: column; }
.key {
  flex: 1 1 auto; min-width: 46px; padding: .45em .6em .55em; border-radius: 4px 4px 6px 6px; cursor: pointer; position: relative;
  background: linear-gradient(var(--key1), var(--key2)); color: var(--key-ink); border: 1px solid rgba(0,0,0,.6);
  font-variant: small-caps; text-transform: lowercase; letter-spacing: .1em; font-size: .9rem;
  box-shadow: 0 4px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.12);
  transition: transform .05s, box-shadow .05s; display: inline-flex; align-items: center; justify-content: center; gap: .35em;
}
.key:active, .key.lit { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.55), inset 0 2px 4px rgba(0,0,0,.25); }
.key.lit::after { content: ''; position: absolute; top: 4px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--led); box-shadow: 0 0 6px var(--led); }
.key:disabled { opacity: .5; cursor: default; transform: none; }
.key.wide { flex-grow: 2; font-size: 1.05rem; }
.key.rec { color: #8a1c18; } .key.rec:not(:disabled):hover { color: #c22a22; }
.transport .key { font-variant: normal; font-size: 1rem; }
.knobs { gap: 10px; } .knob { flex: 1 1 110px; margin: 0; display: flex; flex-direction: column; gap: .15rem; }
.knob.toggle { flex-direction: row; align-items: center; gap: .4rem; } .knob.toggle input { accent-color: var(--accent); }


.desk { margin-top: 1.4rem; }
.subtabs { display: flex; gap: 2px; flex-wrap: wrap; }
.subtab { background: rgba(0,0,0,.25); border: 1px solid rgba(0,0,0,.4); border-bottom: 0; padding: .35em 1em; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--muted); font-variant: small-caps; text-transform: lowercase; letter-spacing: .1em; }
.subtab.on { background: var(--paper); color: var(--ink); }
.paper .subtab { background: rgba(0,0,0,.06); color: var(--ink-soft); border-color: rgba(0,0,0,.12); } .paper .subtab.on { background: #fbf5e7; color: var(--ink); }
.desk-panel { background: linear-gradient(170deg, var(--paper), var(--paper2)); color: var(--ink); padding: 1.4rem 1.6rem; border-radius: 0 6px 6px 6px; box-shadow: 0 16px 40px rgba(0,0,0,.5); min-height: 240px; }
.desk-panel h3 { margin-top: 0; }
.empty-desk { text-align: center; padding: 2rem; color: var(--ink-soft); }
.panel-bar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; } .panel-bar .sel { width: auto; max-width: 420px; }
.reader { max-width: 46em; margin: 0 auto; font-size: 1.12rem; line-height: 1.7; max-height: 70vh; overflow-y: auto; padding-right: .6rem; }
.ch-title { font-style: italic; text-align: center; margin: 1em 0; }
.para { position: relative; } .para p { margin: 0 0 1em; text-indent: 1.5em; }
.para .mini-btn { position: absolute; right: -.4rem; top: 0; opacity: 0; } .para:hover .mini-btn { opacity: 1; }
.pg { font-family: var(--mono); font-size: .65rem; color: #9a8466; }
.para .pg { position: absolute; left: -2.6rem; top: .4em; }
.seg { cursor: pointer; border-radius: 3px; transition: background .2s; }
.seg:hover { background: rgba(110,30,34,.08); }
.seg:not(.rec) { color: #8a7660; }
.seg.now { background: rgba(255,179,71,.22); box-shadow: 0 0 0 2px rgba(255,179,71,.22); }
.word-now { background: var(--accent); color: #f6ecd8; border-radius: 2px; }
.ms-meta { display: grid; grid-template-columns: 2fr 1.4fr auto; gap: 1rem; align-items: end; }
.ms-cols { display: grid; grid-template-columns: 280px 1fr; gap: 1.4rem; margin-top: 1rem; }
.ms-chapters { margin: 0; padding: 0 .4rem 0 1.2rem; max-height: 70vh; overflow-y: auto; font-size: .95rem; }
.ms-chapters li { padding: .2em 0; } .ms-chapters li.on button { font-weight: 600; color: var(--accent); }
.ms-chapters li.skip { opacity: .5; } .ms-chapters small { display: block; color: #8a7660; font-size: .75rem; }
.ms-body { max-height: 70vh; overflow-y: auto; padding-right: .4rem; }
.ms-chhead { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; position: sticky; top: 0; background: var(--paper); padding: .4rem 0; z-index: 1; }
.ms-chtitle { flex: 1 1 260px; font-size: 1.2rem !important; font-style: italic; }
.ms-para { margin: .6rem 0; } .ms-tools { display: flex; gap: .3rem; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.meter { height: 8px; background: rgba(0,0,0,.12); border-radius: 4px; overflow: hidden; } .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #b0503a); }
.meter.sm { height: 5px; min-width: 80px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); border-bottom: 1px solid rgba(0,0,0,.2); padding: .3em .4em; }
.tbl td { padding: .3em .4em; border-bottom: 1px dotted rgba(0,0,0,.15); vertical-align: middle; }
.tbl tr.dim td { opacity: .5; } .tbl tr.on td { background: rgba(255,179,71,.15); }
.tbl input { padding: .15em .3em !important; font-size: .85rem; }
.chap-tbl { margin-top: 1rem; }
.limits { margin-top: 1rem; border: 1px solid rgba(110,30,34,.35); padding: .7rem 1rem; border-radius: 4px; background: rgba(110,30,34,.05); }
.limits .engr { color: var(--accent); text-shadow: none; } .limits p { margin: .3em 0 0; font-size: .92rem; }
.unres { margin-top: .8rem; } .unres .engr { color: var(--ink-soft); text-shadow: none; display: block; margin-bottom: .3rem; }

  let engine;

    engine = await getEngine();

  const job = { bookId: book.id, voice: voiceTag(book), gis: list.map((s) => s.gi), label, status: 'running', at: Date.now() };
  await IDB.put('jobs', book.id, job);

    if (b.dataset.n != null) { const [i, d] = b.dataset.n.split(':').map(Number); words[i][1] = +(words[i][1] + d * 0.02).toFixed(3); words[i][2] = +(words[i][2] + d * 0.02).toFixed(3); table(); draw(); }
    if (b.dataset.x != null) { words.splice(+b.dataset.x, 1); table(); draw(); }
  });
  m.parentElement.addEventListener('closing', stop);
  table();
  try { pcm = await getSamplePCM(s); } catch (e) { msg(e.message); return; }
  draw();
  $('#smWave').onclick = (e) => { const r = e.target.getBoundingClientRect(), t = ((e.clientX - r.left) / r.width) * (pcm.length / RATE); const w = words.find((x) => t >= x[1] && t <= x[2]); if (w) play(w[1], w[2]); else play(t, t + 1.5); };
  $('#smPlay').onclick = () => play(0, pcm.length / RATE);
  $('#smStop').onclick = stop;
  $('#smDl').onclick = async () => { try { downloadBlob(await getSampleBlob(s.path), s.file_name || 'take.wav'); logAct('sample_download', { file: s.file_name }); } catch (e) { toast(e.message, 'err'); } };
  $('#smAlign').onclick = async () => { const tx = $('#smTx').value.trim(); if (!tx) { msg('Type what is said first.'); return; } const r = await alignBest(pcm, RATE, tx, msg); words = r.words; s._aligned = r.by; table(); draw(); msg(`${words.length} words lined up${r.by === 'aligner' ? ' precisely' : ' (estimated — the aligner couldn’t load)'}. Click a few to check, then Save.`); };
  $('#smWhisper').onclick = async () => {
    try { const r = await transcribeAndAlign(s, msg); words = r.words; $('#smTx').value = r.text; s._aligned = r.by; table(); draw(); msg(`${words.length} words found and lined up. Review, then Save.`); }
    catch (e) { console.error(e); msg('Transcriber failed: ' + e.message); }
  };
  $('#smSave').onclick = async () => {
    try {
      const clean = words.map((w) => [String(w[0]).trim(), +(+w[1]).toFixed(3), +(+w[2]).toFixed(3)]).filter((w) => w[0] && w[2] > w[1]);
      await updateSample(s, { words: clean, transcript: $('#smTx').value.trim() || null, aligned_by: clean.length ? (s._aligned || (s.aligned_by ? 'edited' : 'manual')) : null, speaker: $('#smSpk').value.trim() || null, emotion: $('#smEmo').value.trim() || null, quality: $('#smQ').value, recorded_on: $('#smDate').value || null, source: $('#smSrc').value.trim() || null, source_url: $('#smUrl').value.trim() || null });
      toast('Tape saved.'); closeModal(); renderVoiceDetail(); refreshCases();
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#smDel').onclick = async () => { if (!(await confirmBox(`Delete “${s.file_name}” from the archive?`, 'Delete', true))) return; try { await deleteSample(s); toast('Tape removed.'); renderVoiceDetail(); refreshCases(); } catch (e) { toast(e.message, 'err'); } };
}

async function importPdf(file) {
  if (!requireEntitled()) return;
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { toast('That file isn’t a PDF.', 'err'); return; }
  if (S.importing) return;
  if (R.running) stopRender();
  S.importing = { n: 0, total: 0, note: 'opening' }; paintBayA();
  try {
    const struct = await extractPdf(file, { ocr: S.ocr, onProgress: (n, t, note) => { S.importing.n = n; S.importing.total = t; S.importing.note = note || 'reading'; if (n % 4 === 0 || note) paintBayA(); } });
    if (!struct.chapters.length) throw new Error(S.ocr ? 'No readable text was found, even with OCR.' : 'No readable text found. If this is a scanned book, switch OCR on and insert it again.');
    S.importing = null;
    await saveNewBook(struct, 'book_import');
  } catch (e) { console.error(e); S.importing = null; paintBayA(); toast(e.message || String(e), 'err', 9000); }
}
function textToStruct(text, title, author) {
  const HEAD = /^(chapter|part|book|prologue|epilogue|introduction|preface)\b.{0,60}$/i;
  const blocks = text.replace(/\r/g, '').split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
  const paras = blocks.length > 1 ? blocks : text.split(/\n+/).map((b) => b.trim()).filter(Boolean);
  const chapters = []; let ch = null;
  for (const p of paras) {
    const first = p.split('\n')[0].trim();
    if (HEAD.test(first) && first.length < 70) { ch = { id: uuid(), title: first, page: 1, skip: false, paragraphs: [] }; chapters.push(ch); const rest = p.slice(first.length).trim(); if (rest) ch.paragraphs.push({ t: rest.replace(/\s+/g, ' '), p: 1 }); continue; }
    if (!ch) { ch = { id: uuid(), title, page: 1, skip: false, paragraphs: [] }; chapters.push(ch); }
    ch.paragraphs.push({ t: p.replace(/\s+/g, ' '), p: 1 });
  }
  return { v: 1, title, author, pages: 1, chapters: chapters.filter((c) => c.paragraphs.length) };
}
async function saveNewBook(struct, action) {
  if (!struct.chapters.length) { toast('There was no text to read.', 'err'); return; }
  try {
    const id = uuid(), path = `${S.user.id}/books/${id}.json`, counts = structCounts(struct);
    await sbUpload(path, new Blob([JSON.stringify(struct)], { type: 'application/json' }), 'application/json');
    const archive = S.voices.find((x) => x.id === S.voiceSel && (S.samples[x.id] || []).some((y) => y.words && y.words.length));
    const voiceId = archive ? archive.id : null, std = archive ? null : (S.lastStd || 'af_heart');
    const { data, error } = await sb.from('books').insert({ id, title: struct.title, author: struct.author, pages: struct.pages, chapter_count: counts.chapters, segment_count: counts.segments, total_chars: counts.chars, voice_id: voiceId, std_voice: std, struct_path: path }).select().single();
    if (error) throw error;

  'st-play-view': () => studioPlay(ST.v0, ST.v1), 'st-stop': () => studioStopAudio(),

  'st-split': () => { const s = ST.segs[ST.sel]; if (!s || ST.cursor <= s.s || ST.cursor >= s.e) { toast('Place the cursor inside the selected region first.', 'err'); return; } ST.segs.splice(ST.sel + 1, 0, { ...s, id: uuid(), s: ST.cursor }); s.e = ST.cursor; studioDraw(); },
  'st-merge': () => { const s = ST.segs[ST.sel], n = ST.segs[ST.sel + 1]; if (s && n) { s.e = n.e; s.flag = s.flag || n.flag; ST.segs.splice(ST.sel + 1, 1); studioDraw(); } },
  'st-del': () => { if (ST.sel >= 0) { ST.segs.splice(ST.sel, 1); ST.sel = -1; studioDraw(); } },
  'st-add': () => { const s = clamp(ST.cursor - 1, 0, ST.dur), e = clamp(ST.cursor + 1, 0, ST.dur); ST.segs.push({ id: uuid(), s, e, spk: ST.target, ex: false, flag: false }); ST.segs.sort((a, b) => a.s - b.s); ST.sel = ST.segs.findIndex((x) => x.s === s); studioDraw(); },

  'st-save': async () => {
    if (!requireEntitled()) return;
    if (!S.voices.length) { toast('Create a voice archive first.', 'err'); return; }
    const f = await formBox('File isolated regions', [
      { name: 'voice', label: 'Into voice archive', type: 'select', value: S.voiceSel || S.voices[0].id, options: S.voices.map((v) => [v.id, v.name]) },
      { name: 'speaker', label: 'Speaker' }, { name: 'emotion', label: 'Emotion / style' }, { name: 'date', label: 'Recorded on', type: 'date' }, { name: 'source_url', label: 'Source link', type: 'url' },
      { name: 'merge', label: 'Join regions less than 0.6 s apart into longer tapes (up to 25 s)', type: 'checkbox', value: true },
    ], 'File');

  'shelf-load': async (el) => { const b = S.books.find((x) => x.id === el.dataset.id); S.tab = 'deck'; renderView(); try { await loadBook(b); } catch (e) { toast(e.message, 'err'); } },
  'shelf-style': async (el) => { const b = S.books.find((x) => x.id === el.dataset.id); const f = await formBox('Cassette style', styleFields(b.style)); if (!f) return; const { error } = await sb.from('books').update({ style: f }).eq('id', b.id); if (error) toast(error.message, 'err'); else { b.style = f; renderShelf(); } },
  'shelf-del': async (el) => {
    const b = S.books.find((x) => x.id === el.dataset.id);
    if (!(await confirmBox(`Delete “${b.title}” from the shelf? Recordings cached on this device for it will no longer be reachable.`, 'Delete', true))) return;
    if (S.book && S.book.id === b.id) await ejectBook();
    try { const tapes = await sbList(`${S.user.id}/tapes/${b.id}`).catch(() => []); await sbRemove([b.struct_path]); if (tapes.length) toast('Cloud tapes for this book remain in storage.', 'info'); } catch (e) { /* ignore */ }
    const { error } = await sb.from('books').delete().eq('id', b.id); if (error) { toast(error.message, 'err'); return; }
    S.books = S.books.filter((x) => x.id !== b.id); logAct('book_delete', { title: b.title }); renderShelf();
  },
  'theme-save': async () => { const { error } = await sb.from('profiles').update({ theme: S.profile.theme }).eq('id', S.user.id); if (error) toast(error.message, 'err'); else { toast('Your machine has been refinished.'); logAct('theme_change', {}); } },
  'theme-reset': () => { S.profile.theme = {}; applyTheme(); renderCustom(); },
  'dev-refresh': () => devLoad(),
  'kit-load': () => kitLoad(),
  'kit-view': (el) => { const f = S.kit.find((x) => x.name === el.dataset.name); if (f) openModal(`<h3>${esc(f.name)}</h3><pre class="code">${esc(f.content)}</pre>`, { wide: true }); },
  'kit-dl': async (el) => {
    const n = el.dataset.name;
    if (n === 'index.html') { downloadBlob(new Blob([await liveIndexHtml()], { type: 'text/html' }), 'index.html'); return; }
    const f = S.kit.find((x) => x.name === n); if (f) downloadBlob(new Blob([f.content], { type: 'text/plain' }), n.split('/').pop());
  },
  'kit-zip': async () => {
    const files = [{ name: 'magnetic-library/index.html', data: await liveIndexHtml() }, ...S.kit.map((f) => ({ name: 'magnetic-library/' + f.name, data: f.content }))];
    downloadBlob(makeZip(files), 'magnetic-library.zip'); logAct('dev_kit_download', {});
  },
  'dev-sel': (el) => { S.dev.sel = el.dataset.id || null; paintDev(); },
  'dev-paid': async (el) => {
    const id = el.dataset.id, val = el.dataset.v === '1', u = S.dev.profiles.find((x) => x.id === id);
    if (!(await confirmBox(`${val ? 'Grant' : 'Revoke'} access for ${u.username}?`, val ? 'Grant' : 'Revoke', !val))) return;
    const { error } = await sb.from('profiles').update({ is_paid: val, paid_at: val ? new Date().toISOString() : u.paid_at }).eq('id', id);
    if (error) toast(error.message, 'err'); else { logAct(val ? 'dev_grant' : 'dev_revoke', { user: u.username }); devLoad(); }
  },
};
async function kitLoad() {
  const box = $('#kitBox'); if (!box) return;
  const { data, error } = await sb.from('dev_kit').select('name,content,updated_at').order('name');
  if (error) { box.querySelector('button').insertAdjacentHTML('afterend', `<p class="err">${esc(error.message)}</p>`); return; }
  S.kit = data || [];
  box.innerHTML = `<div class="row between"><h3>Deployment kit</h3><span class="badge">DEV ONLY</span></div>
    <p class="muted">Connected to <code>${esc(CONFIG.SUPABASE_URL || 'this browser only')}</code>. Members never see this section.</p>
    <table class="tbl"><thead><tr><th>File</th><th>Size</th><th>Updated</th><th></th></tr></thead><tbody>
    <tr><td>index.html <small class="muted">(the live site file)</small></td><td>—</td><td>—</td><td class="nowrap"><button class="mini-btn" data-act="kit-dl" data-name="index.html">download</button></td></tr>
    ${S.kit.map((f) => `<tr><td>${esc(f.name)}</td><td>${fmtBytes(new Blob([f.content]).size)}</td><td>${fmtDate(f.updated_at)}</td><td class="nowrap"><button class="mini-btn" data-act="kit-view" data-name="${esc(f.name)}">view</button><button class="mini-btn" data-act="kit-dl" data-name="${esc(f.name)}">download</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">The kit is empty — re-run the schema to restore it.</td></tr>'}
    </tbody></table>
    <div class="row"><button class="btn" data-act="kit-zip">Download everything (.zip)</button></div>`;
}
async function liveIndexHtml() {
  try { const r = await fetch(location.href.split('#')[0], { cache: 'no-store' }); if (r.ok) return await r.text(); } catch (e) { /* ignore */ }
  return '<!doctype html>' + document.documentElement.outerHTML;
}
const CHANGES = {
  autotx: (el) => { localStorage.setItem('ml.autotx', el.checked ? '1' : '0'); if (el.checked) { const v = S.voices.find((x) => x.id === S.voiceSel); (S.samples[v && v.id] || []).forEach((x) => queueTranscribe(x)); } },
  'voice-select': (el) => setBookVoice(el.value),
  speed: (el) => Player.setRate(+el.value), sleep: (el) => Player.setSleep(el.value),
  'fx-hiss': (el) => Player.setFx('hiss', el.checked), 'fx-sat': (el) => Player.setFx('sat', el.checked),
  'read-ch': (el) => { S.readCi = +el.value; renderDeskPanel(); },
  'ms-meta': (el) => { S.struct[el.dataset.k] = el.value.trim(); markDirty(); },
  'ms-chtitle': (el) => { S.struct.chapters[+el.dataset.ci].title = el.value.trim() || 'Untitled'; markDirty(); },
  'ms-skip': (el) => { S.struct.chapters[+el.dataset.ci].skip = el.checked; markDirty(); },
  'ms-para': (el) => { S.struct.chapters[S.msCi].paragraphs[+el.dataset.pi].t = el.value.replace(/\s+/g, ' ').trim(); markDirty(); },
  'opt-gap': (el) => { S.engineOpts = { ...(S.engineOpts || {}), wordGap: +el.value / 1000 }; S.engine = null; const g = $('#gapVal'); if (g) g.textContent = el.value + ' ms'; },
  'opt-pitch': (el) => { S.engineOpts = { ...(S.engineOpts || {}), pitchMatch: el.checked }; S.engine = null; },
  'opt-frag': (el) => { S.engineOpts = { ...(S.engineOpts || {}), fragments: el.checked }; S.engine = null; },
  'opt-dur': (el) => { S.engineOpts = { ...(S.engineOpts || {}), durationMatch: el.checked }; S.engine = null; },
  theme: (el) => {
    const [grp, k] = el.dataset.k.split('.'), th = S.profile.theme = { ...(S.profile.theme || {}) };
    th[grp] = { ...(th[grp] || {}), [k]: el.value }; applyTheme();
    const pv = $('#themePreview'); if (pv) pv.innerHTML = cassetteSVG({ title: 'A Room of One’s Own', sub: 'Virginia Woolf', spin: true });
  },
  'dev-hide': (el) => { S.devHideDev = el.checked; paintDev(); },
};
function bindEvents() {
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act]; if (!fn) return;
    e.preventDefault();
    Promise.resolve(fn(el, e)).catch((err) => { console.error(err); toast(err.message || String(err), 'err'); });
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]'); if (!el) return;
    const fn = CHANGES[el.dataset.change]; if (fn) Promise.resolve(fn(el, e)).catch((err) => toast(err.message || String(err), 'err'));
  });
  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset && el.dataset.input === 'drawer-filter') { S.drawerFilter = el.value; debouncedDrawer(); }
    if (el.dataset && el.dataset.change === 'opt-gap') { const g = $('#gapVal'); if (g) g.textContent = el.value + ' ms'; }
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id === 'lexForm') { e.preventDefault(); const f = e.target; await lexAdd(f.w.value, f.r.value.trim()); renderVoiceDetail(); }
  });
  document.addEventListener('dragover', (e) => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', (e) => { const d = e.target.closest && e.target.closest('[data-drop]'); if (d) d.classList.remove('over'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    const d = e.target.closest && e.target.closest('[data-drop]'); if (!d) return;
    e.preventDefault(); d.classList.remove('over');
    const files = Array.from(e.dataTransfer.files || []); if (!files.length) return;
    if (d.dataset.drop === 'pdf') importPdf(files[0]);
    else if (d.dataset.drop === 'audio') importAudioFiles(files);
    else if (d.dataset.drop === 'studio') studioLoad(files[0]);
  });
  document.addEventListener('click', (e) => {
    const c = e.target.closest('#stWave, #stTape'); if (!c || !ST.pcm) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (c.id === 'stTape') { studioCenter(x * ST.dur); studioDraw(); return; }
    const t = ST.v0 + x * (ST.v1 - ST.v0); ST.cursor = t;
    ST.sel = ST.segs.findIndex((s) => t >= s.s && t <= s.e); studioDraw();
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea,select')) return;
    if (e.code === 'Space' && S.tab === 'deck' && S.book) { e.preventDefault(); Player.playing ? Player.pause() : Player.play(); }
  });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'studio') studioDraw(); if (S.tab === 'deck' && S.sub === 'audition') drawAudition(); }, 200); });
}
const debouncedDrawer = debounce(() => { const v = S.voices.find((x) => x.id === S.voiceSel); const body = $('#vtabBody'); if (v && body && S.vtab === 'drawer') { const inp = $('[data-input="drawer-filter"]'); const pos = inp ? inp.selectionStart : 0; body.innerHTML = vtabDrawer(v, S.samples[v.id] || []); const ni = $('[data-input="drawer-filter"]'); if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); } } }, 250);

document.addEventListener('DOMContentLoaded', boot);

</script>
